  <!-- ============ HALAMAN: TOKOH & PERUSAHAAN (Wikidata + Wikipedia; tanpa data pribadi) ============ -->
  <section id="page-people" class="page ppl-page" hidden aria-label="Tokoh dan perusahaan">
    <section class="card ppl-card" aria-labelledby="pplTitle">
      <div class="card-head"><h2 id="pplTitle">Tokoh dan perusahaan</h2><span class="spacer"></span><span class="meta">Wikidata (CC0) · Wikipedia (CC BY-SA)</span></div>
      <div class="ppl-in">
        <form id="pplForm" class="ppl-form" role="search" aria-label="Cari tokoh atau perusahaan">
          <input id="pplQ" type="search" maxlength="80" placeholder="Nama tokoh atau perusahaan: Jensen Huang, Sri Mulyani, Nvidia" autocomplete="off" aria-label="Nama tokoh atau perusahaan">
          <button type="submit" class="mini-btn">Cari</button>
        </form>
        <div id="pplList"></div>
        <div id="pplBody"></div>
      </div>
    </section>
  </section>
