  <!-- ============ HALAMAN: VALAS (daftar + grafik aset terpilih) ============ -->
  <section id="page-fx" class="page mk-page" hidden aria-label="Valas">
    <section class="card mk-card" aria-labelledby="mkFxTitle">
      <div class="card-head">
        <h2 id="mkFxTitle">Valas</h2>
        <span class="meta" id="mkFxMeta" role="status"></span>
        <span class="spacer"></span>
        <button type="button" class="mini-btn" data-mk-reload>Muat ulang</button>
        <button type="button" class="mini-btn" data-mk-csv title="Unduh tabel sebagai CSV">CSV</button>
      </div>
      <div class="mk-in">
        <div class="mk-extra" id="mkFxExtra"></div>
        <div class="table-wrap" id="mkFxBody"></div>
        <p class="hint" id="mkFxNote"></p>
      </div>
    </section>
    <section class="card mk-chart-card" aria-label="Grafik aset terpilih">
      <div class="card-head"><h2 id="mkFxChartTitle">Grafik</h2><span class="spacer"></span><button type="button" class="mini-btn" data-mk-open>Buka detail</button></div>
      <div class="mk-chart" id="mkFxChart"></div>
    </section>
  </section>
