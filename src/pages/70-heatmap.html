  <!-- ============ HALAMAN: HEATMAP (ukuran = kapitalisasi pasar nyata, warna = perubahan %) ============ -->
  <section id="page-heatmap" class="page hm-page" hidden aria-label="Heatmap">
    <section class="card hm-card" aria-labelledby="hmTitle">
      <div class="card-head">
        <h2 id="hmTitle">Heatmap</h2>
        <div class="seg" role="group" aria-label="Wilayah" id="hmRegions"></div>
        <span class="spacer"></span>
        <span class="meta" id="hmMeta" role="status"></span>
        <button type="button" class="mini-btn" id="hmReload">Muat ulang</button>
      </div>
      <div class="hm-in">
        <div class="hm-map" id="hmMap"></div>
        <div class="hm-legend" id="hmLegend"></div>
        <div id="hmRest"></div>
        <p class="hint" id="hmNote"></p>
      </div>
    </section>
  </section>
