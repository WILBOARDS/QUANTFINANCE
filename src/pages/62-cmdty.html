  <!-- ============ HALAMAN: KOMODITAS (daftar + grafik aset terpilih) ============ -->
  <section id="page-cmdty" class="page mk-page" hidden aria-label="Komoditas">
    <section class="card mk-card" aria-labelledby="mkCmdtyTitle">
      <div class="card-head">
        <h2 id="mkCmdtyTitle">Komoditas</h2>
        <span class="meta" id="mkCmdtyMeta" role="status"></span>
        <span class="spacer"></span>
        <button type="button" class="mini-btn" data-mk-reload>Muat ulang</button>
        <button type="button" class="mini-btn" data-mk-csv title="Unduh tabel sebagai CSV">CSV</button>
      </div>
      <div class="mk-in">
        <div class="mk-extra" id="mkCmdtyExtra"></div>
        <div class="table-wrap" id="mkCmdtyBody"></div>
        <p class="hint" id="mkCmdtyNote"></p>
      </div>
    </section>
    <section class="card mk-chart-card" aria-label="Grafik aset terpilih">
      <div class="card-head"><h2 id="mkCmdtyChartTitle">Grafik</h2><span class="spacer"></span><button type="button" class="mini-btn" data-mk-open>Buka detail</button></div>
      <div class="mk-chart" id="mkCmdtyChart"></div>
    </section>
  </section>
